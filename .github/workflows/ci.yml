name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Type check (svelte-check)
        working-directory: frontend
        run: npm run check
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust (fmt, clippy, test)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets

  msrv:
    name: MSRV (1.85)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      # Toolchain passed as an input, not as the action ref: Dependabot treats a
      # ref like @1.85.0 as a version and "bumps" it to a nonexistent Rust.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --all-targets

  shell:
    name: Shell scripts (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: shellcheck (preinstalled on ubuntu-latest)
        run: shellcheck --version && shellcheck -x deploy/*.sh
      - name: One release signing key everywhere
        # The updater pins the public key of deploy/minisign.pub; the release job checks every
        # signature against that file.
        run: |
          set -euo pipefail
          if [[ ! -f deploy/minisign.pub ]]; then
            echo "::error file=deploy/minisign.pub::deploy/minisign.pub is missing: generate the release key (README, Releases)"
            exit 1
          fi
          file="$(sed -n '2p' deploy/minisign.pub | tr -d '[:space:]')"
          root="$(sed -n 's/^MINISIGN_PUBKEY="\([^"]*\)"/\1/p' deploy/cuemix-update.sh)"
          if [[ ! "${file}" =~ ^RW[A-Za-z0-9+/]{54}$ || "${file}" != "${root}" ]]; then
            echo "::error::MINISIGN_PUBKEY in deploy/cuemix-update.sh must equal the key in deploy/minisign.pub"
            exit 1
          fi
          echo "release key: ${file}"
      - name: One version floor everywhere
        # The oldest installable release is written in three places; they must agree.
        run: |
          set -euo pipefail
          file="$(tr -d '[:space:]' < deploy/min-version)"
          server="$(sed -n 's/^pub(super) const MIN_PIN_VERSION: &str = "\([^"]*\)";/\1/p' src/web/update.rs)"
          root="$(sed -n 's/^MIN_VERSION="\([^"]*\)"/\1/p' deploy/cuemix-update.sh)"
          echo "deploy/min-version=${file} src/web/update.rs=${server} deploy/cuemix-update.sh=${root}"
          if [[ -z "${file}" || "${file}" != "${server}" || "${file}" != "${root}" ]]; then
            echo "::error::the version floor differs between deploy/min-version, src/web/update.rs and deploy/cuemix-update.sh"
            exit 1
          fi

  secrets:
    name: Secret scan (gitleaks + RFC1918)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned release)
        env:
          GITLEAKS_VERSION: 8.21.2
          # From gitleaks_8.21.2_checksums.txt; change both together.
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v
      - name: Reject private (RFC1918) IPv4 addresses in tracked files
        run: |
          set -u
          pattern='\b(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})\b'
          if git grep -nIE "$pattern" -- . \
              ':(exclude).gitleaks.toml' \
              ':(exclude)Cargo.lock' \
              ':(exclude)frontend/package-lock.json'; then
            echo "::error::RFC1918 address found in tracked files (see above)"
            exit 1
          fi
          echo "No RFC1918 addresses found."

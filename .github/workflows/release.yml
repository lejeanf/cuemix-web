name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# No token rights by default: each job gets only what it needs. The jobs that run third-party
# build code (npm packages, crate build scripts) can only read; writing the release and
# pushing the image happen in jobs that run no such code.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ "${tag}" != "${cargo_version}" ]]; then
            echo "::error file=Cargo.toml::Release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}. Bump version in Cargo.toml to ${tag} (or retag as v${cargo_version}) before releasing."
            exit 1
          fi
          echo "Release tag ${GITHUB_REF_NAME} matches Cargo.toml version ${cargo_version}"
          # The page compares its build version (frontend/package.json) with the
          # server's to reload stale tabs: a mismatch would reload every new tab once.
          pkg_version="$(grep -m1 '"version"' frontend/package.json | cut -d'"' -f4)"
          if [[ "${pkg_version}" != "${cargo_version}" ]]; then
            echo "::error file=frontend/package.json::frontend/package.json version ${pkg_version} does not match Cargo.toml version ${cargo_version}. Bump both before releasing."
            exit 1
          fi
          # The floor this release publishes (deploy/min-version) must not refuse the release itself.
          floor="$(tr -d '[:space:]' < deploy/min-version)"
          if [[ ! "${floor}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$(printf '%s\n%s\n' "${floor}" "${tag%%-*}" | sort -V | head -n 1)" != "${floor}" ]]; then
            echo "::error file=deploy/min-version::deploy/min-version (${floor}) must be X.Y.Z and not newer than ${tag}."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No dependency cache in release builds: a cache written by another run must never
          # end up in a published binary.
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Binary ${{ matrix.target }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-zigbuild,cargo-deb
      - name: Build
        run: cargo zigbuild --release --locked --target "$TARGET"
      - name: Package .deb
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo deb --no-build --no-strip --target "$TARGET" --output "dist/cuemix-web-${VERSION}-${TARGET}.deb"
      - name: Package tar.gz and checksums
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "target/${TARGET}/release/cuemix-web" stage/cuemix-web
          name="cuemix-web-${VERSION}-${TARGET}"
          tar -czf "dist/${name}.tar.gz" -C stage cuemix-web
          cp "target/${TARGET}/release/cuemix-web" "raw-cuemix-web-${TARGET}"
          cd dist
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          sha256sum "${name}.deb" > "${name}.deb.sha256"
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
      - name: Upload raw binary (for Docker)
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: raw-cuemix-web-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for deploy/min-version (the floor installed updaters read from the newest release).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: deploy/min-version
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: List files
        run: ls -l release
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            release/*.tar.gz
            release/*.deb
            release/*.sha256
            deploy/min-version
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}

  docker:
    name: Docker image (ghcr.io)
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64-unknown-linux-musl
          path: bin-amd64
      - uses: actions/download-artifact@v8
        with:
          name: bin-aarch64-unknown-linux-musl
          path: bin-arm64
      - name: Lay out build context
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          install -m 0755 bin-amd64/raw-cuemix-web-x86_64-unknown-linux-musl dist/amd64/cuemix-web
          install -m 0755 bin-arm64/raw-cuemix-web-aarch64-unknown-linux-musl dist/arm64/cuemix-web
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cuemix-web" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

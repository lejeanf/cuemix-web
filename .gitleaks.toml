title = "cuemix-web security rules"

# Keep gitleaks' built-in secret rules active alongside the custom rule below.
[extend]
useDefault = true

[[rules]]
id = "private-ipv4-leak"
description = "Detect real private IPv4 addresses (RFC1918)"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
# HANDOFF.md once quoted a private IP as a counter-example; it now uses an
# RFC 5737 address, but the old blobs remain in history (gitleaks scans it).
[rules.allowlist]
paths = [
    '''docs/HANDOFF\.md''',
]

# Two unpushed feature-branch commits carried generic RFC1918 *test fixtures*
# (not the maintainer's network) in src/web/server.rs; they were replaced by
# RFC 5737 addresses in the following commit. Scoped to these exact commits.
[allowlist]
description = "Historical test fixtures replaced by RFC 5737 addresses; the release signing PUBLIC key"
commits = [
    "ee6c8394852a59e6b07efa624fa9ffdae5dc850c",
    "875d164b62286b20256bf0c4a09db89d40df01a5",
]
# The minisign public key (deploy/minisign.pub, MINISIGN_PUBKEY in deploy/cuemix-update.sh) is
# meant to be published; generic-api-key flags it for its entropy. Only this exact value is
# allowed: change it together with the key.
regexes = [
    '''^RWRZOG3ncoQ3MIA1BYQllxc2D4qv0XeyyLMmPiJjd5ksf5WpD3HLh7Jt$''',
]
